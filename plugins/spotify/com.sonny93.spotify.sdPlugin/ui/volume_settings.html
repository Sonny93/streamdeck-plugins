<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
		<style>
			[hidden] {
				display: none !important;
			}
		</style>
	</head>
	<body>
		<sdpi-item label="Controls" data-fr-label="Contrôle">
			<sdpi-select setting="target" default="spotify">
				<option value="spotify">Spotify</option>
				<option value="focused" data-fr="Application au premier plan">
					App in the foreground
				</option>
				<option value="app" data-fr="Application choisie">Picked app</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item
			id="picked-app"
			label="Picked app"
			data-fr-label="Application choisie"
		>
			<sdpi-select
				setting="appImageName"
				datasource="listAudioApps"
				hot-reload
				loading="Looking for apps playing sound..."
				data-fr-loading="Recherche des applications qui jouent du son..."
				placeholder="Pick an app playing sound"
				data-fr-placeholder="Choisir une application qui joue du son"
			></sdpi-select>
		</sdpi-item>
		<sdpi-item id="picked-app-help" label="">
			<details>
				<summary data-fr="Utilisé seulement avec « Application choisie »">
					Only used with "Picked app"
				</summary>
				<p
					data-fr="La liste montre les applications qui jouent du son en ce moment. Lancez le son dans l’application, puis rouvrez cette liste pour la choisir."
				>
					The list shows the apps playing sound right now. Start the sound in
					the app, then reopen this list to pick it.
				</p>
			</details>
		</sdpi-item>
		<sdpi-item label="Language / Langue">
			<sdpi-select id="language-select">
				<option value="system" data-fr="Système (par défaut)">
					System (default)
				</option>
				<option value="en" lang="en">English</option>
				<option value="fr" lang="fr">Français</option>
			</sdpi-select>
		</sdpi-item>
		<script src="../bin/language_inspector.js"></script>
		<script>
			const PICKED_APP_TARGET = 'app';
			const DEFAULT_TARGET = 'spotify';
			const pickedAppItems = document.querySelectorAll(
				'#picked-app, #picked-app-help'
			);

			function showPickedApp(target) {
				const isPicked = (target ?? DEFAULT_TARGET) === PICKED_APP_TARGET;
				for (const item of pickedAppItems) {
					item.hidden = !isPicked;
				}
			}

			const targetSelect = document.querySelector(
				'sdpi-select[setting="target"]'
			);
			targetSelect.addEventListener('change', () =>
				showPickedApp(targetSelect.value)
			);
			SDPIComponents.streamDeckClient
				.getSettings()
				.then((event) => showPickedApp(event.payload.settings.target));
			SDPIComponents.streamDeckClient.didReceiveSettings.subscribe((event) =>
				showPickedApp(event.payload.settings.target)
			);
			showPickedApp(DEFAULT_TARGET);
		</script>
	</body>
</html>
