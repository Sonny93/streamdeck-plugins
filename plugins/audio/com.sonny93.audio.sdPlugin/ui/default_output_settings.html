<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Output" data-fr-label="Sortie">
			<sdpi-select
				setting="device"
				datasource="listOutputDevices"
				hot-reload
				loading="Looking for outputs..."
				data-fr-loading="Recherche des sorties..."
				placeholder="Pick an output"
				data-fr-placeholder="Choisir une sortie"
			></sdpi-select>
		</sdpi-item>
		<sdpi-item label="Label" data-fr-label="Libellé">
			<sdpi-textfield
				setting="label"
				placeholder="e.g. Headphones"
				data-fr-placeholder="ex. Casque"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Label position" data-fr-label="Position du libellé">
			<sdpi-select setting="labelPosition" default="top">
				<option value="top" data-fr="Haut">Top</option>
				<option value="bottom" data-fr="Bas">Bottom</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="">
			<details>
				<summary data-fr="À propos du libellé">About the label</summary>
				<p
					data-fr="Le libellé prend la couleur de l&#x27;icône. Laissez le titre Stream Deck de la touche vide pour qu&#x27;il ne s&#x27;affiche pas par-dessus."
				>
					The label takes the color of the icon. Leave the Stream Deck title of
					the key empty so it does not show on top of it.
				</p>
			</details>
		</sdpi-item>
		<sdpi-item label="Language / Langue">
			<sdpi-select id="language-select">
				<option value="system" data-fr="Système (par défaut)">
					System (default)
				</option>
				<option value="en" lang="en">English</option>
				<option value="fr" lang="fr">Français</option>
			</sdpi-select>
		</sdpi-item>
		<script src="../bin/language_inspector.js"></script>
	</body>
</html>
