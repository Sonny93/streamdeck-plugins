<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Device" data-fr-label="Périphérique">
			<sdpi-select
				setting="device"
				datasource="listAudioDevices"
				default="default:output"
				hot-reload
				loading="Looking for devices..."
				data-fr-loading="Recherche des périphériques..."
			></sdpi-select>
		</sdpi-item>
		<sdpi-item label="Language / Langue">
			<sdpi-select id="language-select">
				<option value="system" data-fr="Système (par défaut)">
					System (default)
				</option>
				<option value="en" lang="en">English</option>
				<option value="fr" lang="fr">Français</option>
			</sdpi-select>
		</sdpi-item>
		<script src="../bin/language_inspector.js"></script>
	</body>
</html>
