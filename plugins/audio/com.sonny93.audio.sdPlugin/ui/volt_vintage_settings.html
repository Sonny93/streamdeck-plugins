<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Label" data-fr-label="Libellé">
			<sdpi-textfield setting="label" placeholder="Vintage"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Label position" data-fr-label="Position du libellé">
			<sdpi-select setting="labelPosition" default="top">
				<option value="top" data-fr="Haut">Top</option>
				<option value="bottom" data-fr="Bas">Bottom</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="">
			<details>
				<summary data-fr="À propos du libellé">About the label</summary>
				<p
					data-fr='Laissez-le vide pour afficher "Vintage". Le libellé prend la couleur de l&#x27;icône ; laissez le titre Stream Deck de la touche vide pour qu&#x27;il ne s&#x27;affiche pas par-dessus.'
				>
					Leave it empty to show "Vintage". The label takes the color of the
					icon; leave the Stream Deck title of the key empty so it does not show
					on top of it.
				</p>
			</details>
		</sdpi-item>
		<sdpi-item label="Language / Langue">
			<sdpi-select id="language-select">
				<option value="system" data-fr="Système (par défaut)">
					System (default)
				</option>
				<option value="en" lang="en">English</option>
				<option value="fr" lang="fr">Français</option>
			</sdpi-select>
		</sdpi-item>
		<script src="../bin/language_inspector.js"></script>
	</body>
</html>
