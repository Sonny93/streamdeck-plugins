<!doctype html>
<html>
	<head lang="en">
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Label">
			<sdpi-textfield setting="label" placeholder="Vintage"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Label position">
			<sdpi-select setting="labelPosition" default="top">
				<option value="top">Top</option>
				<option value="bottom">Bottom</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="">
			<details>
				<summary>About the label</summary>
				<p>
					Leave it empty to show "Vintage". The label takes the color of the
					icon; leave the Stream Deck title of the key empty so it does not show
					on top of it.
				</p>
			</details>
		</sdpi-item>
	</body>
</html>
