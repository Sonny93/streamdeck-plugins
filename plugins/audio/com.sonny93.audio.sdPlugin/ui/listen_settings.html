<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Input" data-fr-label="Entrée">
			<sdpi-select
				setting="device"
				datasource="listListenSources"
				placeholder="Pick an input"
				data-fr-placeholder="Choisir une entrée"
				hot-reload
				loading="Looking for inputs..."
				data-fr-loading="Recherche des entrées..."
			></sdpi-select>
		</sdpi-item>
		<sdpi-item label="Maximum level (%)" data-fr-label="Niveau maximum (%)">
			<sdpi-range
				setting="maximumLevel"
				min="1"
				max="100"
				step="1"
				default="20"
				showlabels
			></sdpi-range>
		</sdpi-item>
		<sdpi-item label="">
			<details>
				<summary data-fr="À propos du niveau maximum">
					About the maximum level
				</summary>
				<p
					data-fr="Le niveau de l&#x27;entrée ne dépasse jamais ce plafond, pour protéger votre audition. Le niveau du système est cubique : de petits pas comptent. Rien n&#x27;est écouté tant qu&#x27;aucune entrée n&#x27;est choisie."
				>
					The level of the input never goes above this ceiling, to protect your
					hearing. System levels are cubic, so small steps matter. Nothing is
					listened to until an input is picked.
				</p>
			</details>
		</sdpi-item>
		<sdpi-item label="Language / Langue">
			<sdpi-select id="language-select">
				<option value="system" data-fr="Système (par défaut)">
					System (default)
				</option>
				<option value="en" lang="en">English</option>
				<option value="fr" lang="fr">Français</option>
			</sdpi-select>
		</sdpi-item>
		<script src="../bin/language_inspector.js"></script>
	</body>
</html>
