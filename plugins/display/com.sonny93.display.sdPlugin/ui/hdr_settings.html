<!doctype html>
<html>
	<head lang="en">
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Monitor">
			<sdpi-select
				setting="monitor"
				datasource="listMonitors"
				default="primary"
				hot-reload
				loading="Looking for monitors..."
			></sdpi-select>
		</sdpi-item>
		<sdpi-item label="Label">
			<sdpi-textfield setting="label" placeholder="None"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Label position">
			<sdpi-select setting="labelPosition" default="top">
				<option value="top">Top</option>
				<option value="bottom">Bottom</option>
			</sdpi-select>
		</sdpi-item>
	</body>
</html>
