<!doctype html>
<html>
	<head lang="en">
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Monitor">
			<sdpi-select
				setting="monitor"
				datasource="listMonitors"
				default="primary"
				hot-reload
				loading="Looking for monitors..."
			></sdpi-select>
		</sdpi-item>
		<sdpi-item label="Step (%)">
			<sdpi-textfield
				setting="step"
				pattern="\d{1,3}"
				placeholder="5"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Press goes to (%)">
			<sdpi-textfield
				setting="preset"
				pattern="\d{1,3}"
				placeholder="50"
			></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Control">
			<sdpi-select setting="brightnessControl" default="auto">
				<option value="auto">Auto</option>
				<option value="monitor">Monitor (DDC/CI)</option>
				<option value="windows">Windows</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Tap turns off with">
			<sdpi-select setting="offMode" default="blackScreen">
				<option value="blackScreen">Black screen</option>
				<option value="standby">Monitor standby (DDC/CI)</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="">
			<details>
				<summary>About the control</summary>
				<p>
					Monitor changes the backlight over DDC/CI. Windows dims the picture
					instead: from 50 to 100 % in SDR, through the SDR content brightness
					in HDR. Auto uses the monitor, unless it has no DDC/CI or is known to
					ignore it, like the Odyssey G95SD.
				</p>
			</details>
		</sdpi-item>
	</body>
</html>
