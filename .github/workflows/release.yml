name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        required: true
      prerelease:
        description: Publish a prerelease (entries stay under Unreleased)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ARTIFACT_NAME: release-packages
  PACKAGES_DIRECTORY: ${{ github.workspace }}/packages-to-upload

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    permissions:
      contents: write
    uses: minimalstuff/tooling/.github/workflows/release.yml@705224c97824f55bc28a6139ea0aacefe4da82e1 # v0.9.0
    with:
      increment: ${{ inputs.increment }}
      release-script: ${{ inputs.prerelease && 'release:next' || 'release' }}
      node-version-file: mise.toml
    secrets:
      release-deploy-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

  build:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm package

      - name: Verify the packages carry the release version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          FULL_VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          if [[ "$RELEASE_TAG" != "v$FULL_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version v$FULL_VERSION" >&2
            exit 1
          fi
          VERSION="${FULL_VERSION%%-*}"
          read_manifest_version() {
            unzip -p "$1" '*/manifest.json' | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).Version'
          }
          shopt -s nullglob
          PLUGINS=(dist/*.streamDeckPlugin)
          ICON_PACKS=(dist/*.streamDeckIconPack)
          if [[ ${#PLUGINS[@]} -eq 0 || ${#ICON_PACKS[@]} -eq 0 ]]; then
            echo "Expected at least one plugin and one icon pack in dist" >&2
            exit 1
          fi
          for PLUGIN in "${PLUGINS[@]}"; do
            ACTUAL=$(read_manifest_version "$PLUGIN")
            if [[ "$ACTUAL" != "$VERSION.0" ]]; then
              echo "$PLUGIN has version $ACTUAL, expected $VERSION.0" >&2
              exit 1
            fi
          done
          for ICON_PACK in "${ICON_PACKS[@]}"; do
            ACTUAL=$(read_manifest_version "$ICON_PACK")
            if [[ "$ACTUAL" != "$VERSION" ]]; then
              echo "$ICON_PACK has version $ACTUAL, expected $VERSION" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  upload:
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PACKAGES_DIRECTORY }}

      - name: Attach the packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$PACKAGES_DIRECTORY"/* --clobber --repo "$GITHUB_REPOSITORY"
